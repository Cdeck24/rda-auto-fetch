name: Daily Score Fetch
on:
  schedule:
    # 10:05 AM UTC = 6:05 AM EDT (UTC-4)
    - cron: '05 10 * * *'
  workflow_dispatch:

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install hashids

      - name: Run Fetch Script
        run: node fetch-scores.js
